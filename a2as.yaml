tools:
  analyze_scene_with_vlm:
    type: function
    agents: [agent.create_aegis_agent.1, agent.create_aegis_agent.2, agent.create_aegis_agent.3]
    params:
      description: |-
        Analyze a video scene using a Vision Language Model to answer natural language questions.

        Args:
            video_feed_id: The camera ID or video source identifier
            question: Natural language question about the scene
            tool_context: ADK tool context for session state and services
            vlm_method: VLM method to use ("smolvlm" for speed, "seedvl" for accuracy)

        Returns:
            Dict containing analysis results
  analyze_security_situation:
    type: function
    agents: [agent.create_aegis_agent.1, agent.create_aegis_agent.2, agent.create_aegis_agent.3]
    params:
      description: "Perform comprehensive security analysis of a video feed.\n\nThis tool combines YOLO object detection,\
        \ VLM scene analysis, and security\ndecision logic to provide a complete security assessment. It identifies\nthreats,\
        \ assesses crowd situations, and provides actionable recommendations.\n\nArgs:\n    video_feed_id: The camera ID or\
        \ video source identifier (e.g., 'cam1', 'gate_2')\n    tool_context: ADK tool context for session state and services\n\
        \    \nReturns:\n    Dict containing:\n    - status: Success/error status\n    - threat_level: Security threat level\
        \ (low/medium/high)\n    - security_label: Overall security assessment (safe/abnormal)\n    - recommendations: Specific\
        \ action recommendations\n    - detected_objects: Objects found in the scene\n    - scene_analysis: VLM description\
        \ of the scene\n    - incident_detected: Whether an incident was detected"
  detect_objects:
    type: function
    agents: [agent.create_aegis_agent.1, agent.create_aegis_agent.2, agent.create_aegis_agent.3]
    params:
      description: |-
        Detect specific objects in a video feed using YOLO or OWLv2 object detection.

        This tool captures a frame from the specified video feed and runs object detection
        to find the requested objects. It returns bounding box coordinates, confidence scores,
        and detection counts.

        Args:
            video_feed_id: The camera ID or video source identifier (e.g., 'cam1', 'gate_2')
            object_list: List of objects to detect (e.g., ['person', 'backpack', 'car'])
            tool_context: ADK tool context for session state and services
            detection_method: Detection method to use ("yolo" for speed, "owlv2" for accuracy)

        Returns:
            Dict containing:
            - status: Success/error status
            - detection_method: Method used for detection
            - detections: List of detected objects with bounding boxes
            - counts: Count of each detected object type
            - total_objects: Total number of objects detected
            - camera_info: Information about the camera source
  get_camera_info:
    type: function
    agents: [agent.create_aegis_agent.1, agent.create_aegis_agent.2, agent.create_aegis_agent.3]
    params:
      description: Get the camera information for a specific camera.
  get_camera_stream_url:
    type: function
    agents: [agent.create_aegis_agent.1, agent.create_aegis_agent.2, agent.create_aegis_agent.3]
    params:
      description: "Get the video stream URL and information for a specific camera.\n\nThis tool provides a clean interface\
        \ for the agent to obtain camera stream\nURLs and metadata. It maps logical camera names (like 'cam1', 'cam2', 'cam3',\
        \ 'cam4') to\nactual video source URLs and provides detailed camera information.\n\nArgs:\n    camera_id: The logical\
        \ camera identifier (e.g., 'cam1', 'cam2', 'cam3', 'cam4')\n    tool_context: ADK tool context for session state and\
        \ services\n    \nReturns:\n    Dict containing:\n    - status: Success/error status  \n    - camera_url: The video\
        \ stream URL\n    - camera_info: Detailed camera metadata\n    - available_cameras: List of available cameras if requested\
        \ camera not found"
  get_cameras_by_location_type:
    type: function
    agents: [agent.create_aegis_agent.1, agent.create_aegis_agent.2, agent.create_aegis_agent.3]
    params:
      description: "Get cameras filtered by location type (e.g., 'entrance_monitor', 'security_gate').\n\nArgs:\n    location_type:\
        \ Type of camera location to filter by\n    tool_context: ADK tool context for session state and services\n    \n\
        Returns:\n    Dict containing filtered camera information"
  get_cameras_by_type:
    type: function
    agents: [agent.create_aegis_agent.1, agent.create_aegis_agent.2, agent.create_aegis_agent.3]
    params:
      description: "Get all cameras of a specific type.\n\nArgs:\n    camera_type: The type of camera to filter by\n    \n\
        Returns:\n    dict: Cameras matching the specified type"
  get_recent_incidents:
    type: function
    agents: [agent.create_aegis_agent.1, agent.create_aegis_agent.2, agent.create_aegis_agent.3]
    params:
      description: "Retrieve recent security incidents, optionally filtered by camera.\n\nArgs:\n    tool_context: ADK tool\
        \ context for session state and services  \n    camera_id: Optional camera ID to filter by, or None for all cameras\n\
        \    limit: Maximum number of incidents to return. Optional.\n    \nReturns:\n    Dict containing recent incident\
        \ records"
  list_all_cameras:
    type: function
    agents: [agent.create_aegis_agent.1, agent.create_aegis_agent.2, agent.create_aegis_agent.3]
    params:
      description: "List all available cameras in the system.\n\nThis tool provides a complete inventory of available cameras\
        \ with their\nmetadata. Useful for operators to understand available surveillance coverage.\n\nArgs:\n    tool_context:\
        \ ADK tool context for session state and services\n    \nReturns:\n    Dict containing all camera information"
  log_security_incident:
    type: function
    agents: [agent.create_aegis_agent.1, agent.create_aegis_agent.2, agent.create_aegis_agent.3]
    params:
      description: "Log a security incident with evidence capture and structured record keeping.\n\nThis tool creates a permanent\
        \ record of security incidents including timestamps,\ncamera snapshots, incident details, and generates unique incident\
        \ IDs for tracking.\nIt's essential for maintaining security audit trails and evidence collection.\n\nArgs:\n    camera_id:\
        \ The camera where the incident was detected\n    incident_type: Type of incident (e.g., 'threat_detection', 'crowd_control',\
        \ 'abandoned_object')\n    description: Detailed description of the incident\n    tool_context: ADK tool context for\
        \ session state and services\n    severity: Incident severity level ('low', 'medium', 'high', 'critical'). Optional.\n\
        \    \nReturns:\n    Dict containing:\n    - status: Success/error status\n    - incident_id: Unique identifier for\
        \ the incident\n    - log_file_path: Path to the incident log file\n    - evidence_captured: Whether visual evidence\
        \ was captured\n    - timestamp: When the incident was logged"
  SECURITY_TOOLS:
    type: function
    agents: [root_agent]
    params:
      dynamic: "True"
  update_detection_result:
    type: function
    agents: [agent.create_aegis_agent.1, agent.create_aegis_agent.2, agent.create_aegis_agent.3]

