variables:
  AEGIS_{...}:
    type: env
    params:
      caller: [os.getenv]
      path: [aegis.config.settings]
  GOOGLE_CLOUD_LOCATION:
    type: env
    params:
      caller: [os.environ.get]
      path: [scripts.deploy_to_vertex_ai]
  GOOGLE_CLOUD_PROJECT:
    type: env
    params:
      caller: [os.environ.get]
      path: [scripts.deploy_to_vertex_ai]
  STAGING_BUCKET:
    type: env
    params:
      caller: [os.environ.get]
      path: [scripts.deploy_to_vertex_ai]

files:
  ../../viclab:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../../viclab]
  ../../viclab/viclab/image/checkpoints/sam_vit_h_4b8939.pth:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../../viclab/viclab/image/checkpoints/sam_vit_h_4b8939.pth]
  ../checkpoints/yolo11n.pt:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../checkpoints/yolo11n.pt]
  evidence_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
  log_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs, os.path.exists]
  log_file_path:
    type: variable
    actions: [write, read]
    params:
      caller: [open, os.path.exists]
      alias: [log_file]
  model_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists]
  path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists]
